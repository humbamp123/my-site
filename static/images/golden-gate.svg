<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Golden Gate Bridge SVG - Desert Bazaar Theme -->
  <defs>
    <linearGradient id="towerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C75D3A"/>
      <stop offset="50%" stop-color="#A44A3F"/>
      <stop offset="100%" stop-color="#8B3D35"/>
    </linearGradient>
    <linearGradient id="deckGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C75D3A"/>
      <stop offset="100%" stop-color="#A44A3F"/>
    </linearGradient>
  </defs>

  <!-- Left Tower -->
  <g id="tower-left">
    <!-- Tower base/foundation -->
    <rect x="62" y="155" width="36" height="10" fill="url(#towerGradient)"/>
    <rect x="65" y="145" width="30" height="10" fill="url(#towerGradient)"/>

    <!-- Tower lower section (below deck) with X-brace -->
    <rect x="68" y="115" width="24" height="30" fill="url(#towerGradient)"/>
    <line x1="70" y1="118" x2="90" y2="143" stroke="#E8DCC4" stroke-width="1.5"/>
    <line x1="90" y1="118" x2="70" y2="143" stroke="#E8DCC4" stroke-width="1.5"/>

    <!-- Tower upper sections with windows -->
    <!-- Section 1 (bottom) -->
    <rect x="68" y="85" width="24" height="28" fill="url(#towerGradient)"/>
    <rect x="73" y="90" width="14" height="8" fill="#E8DCC4" opacity="0.9"/>
    <rect x="73" y="102" width="14" height="8" fill="#E8DCC4" opacity="0.9"/>

    <!-- Section 2 (middle) -->
    <rect x="70" y="55" width="20" height="28" fill="url(#towerGradient)"/>
    <rect x="74" y="60" width="12" height="8" fill="#E8DCC4" opacity="0.9"/>
    <rect x="74" y="72" width="12" height="8" fill="#E8DCC4" opacity="0.9"/>

    <!-- Section 3 (top) -->
    <rect x="72" y="30" width="16" height="23" fill="url(#towerGradient)"/>
    <rect x="75" y="35" width="10" height="6" fill="#E8DCC4" opacity="0.9"/>
    <rect x="75" y="44" width="10" height="6" fill="#E8DCC4" opacity="0.9"/>

    <!-- Tower cap/finial -->
    <rect x="76" y="22" width="8" height="8" fill="url(#towerGradient)"/>
    <rect x="78" y="18" width="4" height="4" fill="url(#towerGradient)"/>
  </g>

  <!-- Right Tower -->
  <g id="tower-right">
    <!-- Tower base/foundation -->
    <rect x="302" y="155" width="36" height="10" fill="url(#towerGradient)"/>
    <rect x="305" y="145" width="30" height="10" fill="url(#towerGradient)"/>

    <!-- Tower lower section (below deck) with X-brace -->
    <rect x="308" y="115" width="24" height="30" fill="url(#towerGradient)"/>
    <line x1="310" y1="118" x2="330" y2="143" stroke="#E8DCC4" stroke-width="1.5"/>
    <line x1="330" y1="118" x2="310" y2="143" stroke="#E8DCC4" stroke-width="1.5"/>

    <!-- Tower upper sections with windows -->
    <!-- Section 1 (bottom) -->
    <rect x="308" y="85" width="24" height="28" fill="url(#towerGradient)"/>
    <rect x="313" y="90" width="14" height="8" fill="#E8DCC4" opacity="0.9"/>
    <rect x="313" y="102" width="14" height="8" fill="#E8DCC4" opacity="0.9"/>

    <!-- Section 2 (middle) -->
    <rect x="310" y="55" width="20" height="28" fill="url(#towerGradient)"/>
    <rect x="314" y="60" width="12" height="8" fill="#E8DCC4" opacity="0.9"/>
    <rect x="314" y="72" width="12" height="8" fill="#E8DCC4" opacity="0.9"/>

    <!-- Section 3 (top) -->
    <rect x="312" y="30" width="16" height="23" fill="url(#towerGradient)"/>
    <rect x="315" y="35" width="10" height="6" fill="#E8DCC4" opacity="0.9"/>
    <rect x="315" y="44" width="10" height="6" fill="#E8DCC4" opacity="0.9"/>

    <!-- Tower cap/finial -->
    <rect x="316" y="22" width="8" height="8" fill="url(#towerGradient)"/>
    <rect x="318" y="18" width="4" height="4" fill="url(#towerGradient)"/>
  </g>

  <!-- Main Suspension Cables -->
  <!-- Left outer cable (left of left tower) -->
  <path d="M 0 50 Q 40 25, 80 55" stroke="#C75D3A" stroke-width="2.5" fill="none"/>
  <!-- Center cable between towers -->
  <path d="M 80 55 Q 200 140, 320 55" stroke="#C75D3A" stroke-width="2.5" fill="none"/>
  <!-- Right outer cable (right of right tower) -->
  <path d="M 320 55 Q 360 25, 400 50" stroke="#C75D3A" stroke-width="2.5" fill="none"/>

  <!-- Suspender Cables (vertical lines from main cable to deck) -->
  <g stroke="#C75D3A" stroke-width="1" opacity="0.8">
    <!-- Left section suspenders -->
    <line x1="20" y1="42" x2="20" y2="113"/>
    <line x1="35" y1="35" x2="35" y2="113"/>
    <line x1="50" y1="32" x2="50" y2="113"/>
    <line x1="65" y1="38" x2="65" y2="85"/>

    <!-- Center section suspenders -->
    <line x1="100" y1="62" x2="100" y2="113"/>
    <line x1="115" y1="72" x2="115" y2="113"/>
    <line x1="130" y1="82" x2="130" y2="113"/>
    <line x1="145" y1="92" x2="145" y2="113"/>
    <line x1="160" y1="100" x2="160" y2="113"/>
    <line x1="175" y1="106" x2="175" y2="113"/>
    <line x1="190" y1="110" x2="190" y2="113"/>
    <line x1="200" y1="112" x2="200" y2="113"/>
    <line x1="210" y1="110" x2="210" y2="113"/>
    <line x1="225" y1="106" x2="225" y2="113"/>
    <line x1="240" y1="100" x2="240" y2="113"/>
    <line x1="255" y1="92" x2="255" y2="113"/>
    <line x1="270" y1="82" x2="270" y2="113"/>
    <line x1="285" y1="72" x2="285" y2="113"/>
    <line x1="300" y1="62" x2="300" y2="113"/>

    <!-- Right section suspenders -->
    <line x1="335" y1="38" x2="335" y2="85"/>
    <line x1="350" y1="32" x2="350" y2="113"/>
    <line x1="365" y1="35" x2="365" y2="113"/>
    <line x1="380" y1="42" x2="380" y2="113"/>
  </g>

  <!-- Bridge Deck -->
  <rect x="0" y="113" width="400" height="5" fill="url(#deckGradient)"/>

  <!-- Deck Truss Pattern -->
  <g stroke="#E8DCC4" stroke-width="0.8" opacity="0.6">
    <line x1="10" y1="118" x2="10" y2="125"/>
    <line x1="25" y1="118" x2="25" y2="125"/>
    <line x1="40" y1="118" x2="40" y2="125"/>
    <line x1="55" y1="118" x2="55" y2="125"/>
    <line x1="100" y1="118" x2="100" y2="125"/>
    <line x1="115" y1="118" x2="115" y2="125"/>
    <line x1="130" y1="118" x2="130" y2="125"/>
    <line x1="145" y1="118" x2="145" y2="125"/>
    <line x1="160" y1="118" x2="160" y2="125"/>
    <line x1="175" y1="118" x2="175" y2="125"/>
    <line x1="190" y1="118" x2="190" y2="125"/>
    <line x1="205" y1="118" x2="205" y2="125"/>
    <line x1="220" y1="118" x2="220" y2="125"/>
    <line x1="235" y1="118" x2="235" y2="125"/>
    <line x1="250" y1="118" x2="250" y2="125"/>
    <line x1="265" y1="118" x2="265" y2="125"/>
    <line x1="280" y1="118" x2="280" y2="125"/>
    <line x1="295" y1="118" x2="295" y2="125"/>
    <line x1="345" y1="118" x2="345" y2="125"/>
    <line x1="360" y1="118" x2="360" y2="125"/>
    <line x1="375" y1="118" x2="375" y2="125"/>
    <line x1="390" y1="118" x2="390" y2="125"/>
  </g>

  <!-- Deck bottom rail -->
  <rect x="0" y="118" width="400" height="2" fill="#A44A3F"/>
</svg>
